databases:
  - name: mlihrent-db
    plan: free
    databaseName: mlihrent
    user: mlihrent

services:
  - type: web
    name: mlihrent
    runtime: node
    plan: free
    repo: https://github.com/user-shad/mytracker
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mlihrent-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TECHNICIAN_PASSWORD
        sync: false
